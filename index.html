<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Motion Intro Powered by GSAP</title>
    <meta name="author" content="Developer Zahid">
    <link rel="stylesheet" href="./assets/css/style.css">
</head>
<body>
    <main class="canvas">
        <div class="canvas__shutter"></div>
        <span class="scene-1">H</span>
        <span class="scene-2"><span class="scene-3">I</span><span class="scene-2__text">'m</span></span>
        <span class="scene-4"><span class="scene-4__char">Y</span><span class="scene-4__spacer"><span class="scene-4__letter">o</span><span class="scene-4__circle"></span></span><span class="scene-4__char">u</span><span class="scene-4__char">r</span></span>
        <span class="scene-5"><span class="scene-5__prefix">Creative</span> <span class="scene-5__words"></span></span>
    </main>
    <button type="button" class="settings-button" aria-label="Settings" command="show-modal" commandfor="settings-dialog">

        </svg>
    </button>
    <dialog id="settings-dialog" class="settings-dialog" aria-labelledby="settings-dialog-title" closedby="any">
        <h2 id="settings-dialog-title" class="settings-dialog__title">Project Settings</h2>
        <form method="dialog" class="settings-dialog__form">
            <label for="settings-full-name">Full Name:</label>
            <input type="text" id="settings-full-name" name="full_name" placeholder="Full Name">
            <label for="settings-brand-name">Brand Name:</label>
            <input type="text" id="settings-brand-name" name="brand_name" placeholder="Brand Name">
            <label for="settings-theme-color">Theme Color:</label>
            <input type="color" id="settings-theme-color" name="theme_color" placeholder="Theme Color" value="#F62440">
            <button type="submit" class="settings-dialog__button">Save</button>
        </form>
    </dialog>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15/dist/gsap.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15/dist/GSDevTools.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15/dist/TextPlugin.min.js"></script>
    <script type="module" src="./assets/js/main.js"></script>
</body>
</html>
